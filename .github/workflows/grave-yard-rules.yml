name: Grave Yard native build and tests
on:
  push:
    paths:
      - 'the-grave-yard/**'
      - '.github/workflows/grave-yard-rules.yml'
  workflow_dispatch:
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r the-grave-yard/requirements.txt
      - run: python the-grave-yard/src/build.py
      - run: python -m unittest discover -s the-grave-yard/tests -v
      - run: git diff --exit-code -- the-grave-yard/dist the-grave-yard/src/*.gasm the-grave-yard/docs/manifest.json
